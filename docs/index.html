<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuditOS Internal Audit Suite</title>
<meta name="description" content="AI-first internal audit orchestration prototype: risk sensing, assessment, planning, fieldwork, issues and reporting with human-in-the-loop agents.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: operator console. Fixed left rail of lifecycle modules, dense work surface, state shown as pills and severity stripes. */
:root {
  --bg: #f3f5f6;
  --surface: #ffffff;
  --surface-2: #eef2f3;
  --ink: #13212b;
  --ink-2: #4a5a64;
  --ink-3: #7a8a93;
  --line: #dde3e6;
  --accent: #0b6e69;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --rail: #0f1c24;
  --rail-ink: #b9c7cd;
  --crit: #b4232c; --crit-soft: #fbe6e7;
  --warn: #a35c00; --warn-soft: #fbefd9;
  --good: #1d7a3e; --good-soft: #e1f2e6;
  --info: #24589c; --info-soft: #e3ecf8;
  --cat1: #6b4fa0; --cat2: #2a7ab0; --cat3: #c07a12; --cat4: #b4232c; --cat5: #0b6e69; --cat6: #7a6a3a;
  --h1: #fdf1e7; --h2: #f9dcc4; --h3: #f2b98f; --h4: #e48a5c; --h5: #c9553a;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 6px;
  --shadow: 0 1px 2px rgba(15, 28, 36, .06), 0 4px 16px rgba(15, 28, 36, .05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d151a; --surface: #141f26; --surface-2: #1a2730; --ink: #e4ecef; --ink-2: #a9b8bf; --ink-3: #7d8e96; --line: #26353e;
    --accent: #3cb7ad; --accent-ink: #06201e; --accent-soft: #143633; --rail: #081014; --rail-ink: #9fb0b7;
    --crit: #f0707a; --crit-soft: #3a1a1d; --warn: #f0b04a; --warn-soft: #36280f; --good: #5cc983; --good-soft: #15301f; --info: #7fb0ec; --info-soft: #172a40;
    --cat1: #a58ad8; --cat2: #6fb3e0; --cat3: #e6a94a; --cat4: #f0707a; --cat5: #3cb7ad; --cat6: #c9b67a;
    --h1: #2a221c; --h2: #4a3020; --h3: #7a4526; --h4: #a85530; --h5: #d0623e;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d151a; --surface: #141f26; --surface-2: #1a2730; --ink: #e4ecef; --ink-2: #a9b8bf; --ink-3: #7d8e96; --line: #26353e;
  --accent: #3cb7ad; --accent-ink: #06201e; --accent-soft: #143633; --rail: #081014; --rail-ink: #9fb0b7;
  --crit: #f0707a; --crit-soft: #3a1a1d; --warn: #f0b04a; --warn-soft: #36280f; --good: #5cc983; --good-soft: #15301f; --info: #7fb0ec; --info-soft: #172a40;
  --cat1: #a58ad8; --cat2: #6fb3e0; --cat3: #e6a94a; --cat4: #f0707a; --cat5: #3cb7ad; --cat6: #c9b67a;
  --h1: #2a221c; --h2: #4a3020; --h3: #7a4526; --h4: #a85530; --h5: #d0623e;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: 24px; } h2 { font-size: 18px; } h3 { font-size: 15px; } h4 { font-size: 13px; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .id { font-family: var(--font-mono); font-size: 12px; }
.id { color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); } .small { font-size: 12px; } .tiny { font-size: 11px; }

/* Shell */
.app { display: grid; grid-template-columns: 232px 1fr; grid-template-rows: 52px 1fr; height: 100%; }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; white-space: nowrap; }
.brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--rail); display: grid; place-items: center; }
.brand small { font-weight: 400; color: var(--ink-3); margin-left: 4px; }
.topbar .spacer { flex: 1; }
.org-pill { border: 1px solid var(--line); border-radius: var(--r); padding: 5px 10px; font-size: 12px; background: var(--surface-2); white-space: nowrap; }
.mode-pill { font-size: 11px; padding: 3px 8px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); font-weight: 600; white-space: nowrap; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }
.btn.menu-btn { display: none; }

.rail { background: var(--rail); color: var(--rail-ink); padding: 14px 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.rail .section { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #5f737c; padding: 14px 10px 6px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r); color: var(--rail-ink); text-decoration: none; font-size: 13px; position: relative; }
.nav:hover { background: rgba(255,255,255,.05); color: #fff; }
.nav.active { background: rgba(60,183,173,.14); color: #fff; }
.nav.active::before { content: ''; position: absolute; left: -10px; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: #3cb7ad; }
.nav svg { width: 16px; height: 16px; flex: none; opacity: .85; }
.nav .badge { margin-left: auto; background: #3cb7ad; color: #06201e; border-radius: 99px; font-size: 10px; padding: 1px 6px; font-weight: 700; }
.rail .foot { margin-top: auto; padding: 12px 10px 4px; font-size: 11px; color: #5f737c; line-height: 1.45; }

.main { overflow-y: auto; padding: 22px 28px 60px; min-width: 0; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.page-head .sub { color: var(--ink-2); margin-top: 4px; max-width: 70ch; }
.eyebrow { font-size: 11px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }

/* Building blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.card.flush { padding: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-dash { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 1.1fr); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.mt { margin-top: 14px; } .mt2 { margin-top: 22px; }

.kpi { border-left: 3px solid var(--line); }
.kpi .label { font-size: 12px; color: var(--ink-2); }
.kpi .val { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; margin: 2px 0; }
.kpi.crit { border-left-color: var(--crit); } .kpi.crit .val { color: var(--crit); }
.kpi.warn { border-left-color: var(--warn); } .kpi.warn .val { color: var(--warn); }
.kpi.good { border-left-color: var(--good); }
.kpi.acc { border-left-color: var(--accent); }
.kpi[data-go] { cursor: pointer; }
.kpi[data-go]:hover { box-shadow: var(--shadow); }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: var(--r); cursor: pointer; font-size: 13px; white-space: nowrap; line-height: 1.2; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--crit); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.btn svg { width: 14px; height: 14px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 9px 12px; cursor: pointer; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-size: 13px; }
.tab.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; font-weight: 500; border: 1px solid transparent; }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.pill.outline { background: transparent; border-color: var(--line); }
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.ai-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); padding: 2px 6px; border-radius: 4px; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }
tr.stripe-crit td:first-child { box-shadow: inset 3px 0 0 var(--crit); }
tr.stripe-warn td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
tr.group td { background: var(--surface-2); font-weight: 600; font-size: 12px; }
.score { font-family: var(--font-mono); font-weight: 600; font-size: 14px; }
.score.crit { color: var(--crit); } .score.warn { color: var(--warn); } .score.good { color: var(--good); }

.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.field .hint { font-size: 11px; color: var(--ink-3); }
input[type=text], input[type=number], input[type=search], select, textarea { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 7px 9px; font-size: 13px; width: 100%; }
textarea { min-height: 70px; resize: vertical; line-height: 1.45; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }

.banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--r); font-size: 13px; flex-wrap: wrap; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.info { background: var(--info-soft); color: var(--info); }
.banner.acc { background: var(--accent-soft); color: var(--accent); }
.banner .spacer { flex: 1; }
.banner > span:not(.spacer) { flex: 1 1 220px; }

/* Candidate cards in sensing review */
.cand { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; background: var(--surface); display: grid; grid-template-columns: 1fr auto; gap: 12px; }
.cand.decided { opacity: .78; }
.cand .actions { display: flex; flex-direction: column; gap: 6px; min-width: 110px; }
.cand .ev { background: var(--surface-2); border-radius: var(--r); padding: 8px 10px; font-size: 12px; margin-top: 8px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.matchbar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; width: 120px; display: inline-block; vertical-align: middle; }
.matchbar span { display: block; height: 100%; background: var(--accent); }

/* Heat map */
.heat { display: grid; grid-template-columns: 90px repeat(5, minmax(48px, 1fr)); gap: 4px; max-width: 560px; }
.heat .hd { font-size: 11px; color: var(--ink-3); text-align: center; align-self: end; padding-bottom: 4px; }
.heat .rl { font-size: 11px; color: var(--ink-3); text-align: right; padding-right: 6px; align-self: center; }
.cell { aspect-ratio: 1.25; border-radius: 4px; display: grid; place-items: center; position: relative; border: 1px dashed transparent; cursor: default; font-family: var(--font-mono); font-size: 11px; color: rgba(0,0,0,.35); }
.cell.above { border-color: var(--crit); }
.cell.has { cursor: pointer; }
.cell .count { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.cell.sel { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Drawer and modal */
.scrim { position: fixed; inset: 0; background: rgba(8, 16, 20, .45); z-index: 40; display: none; }
.scrim.open { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 50; box-shadow: -8px 0 30px rgba(0,0,0,.15); transform: translateX(100%); transition: transform .2s ease; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer-head { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.drawer-body { padding: 16px 18px 40px; overflow-y: auto; flex: 1; }
.modal { position: fixed; z-index: 60; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(620px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow-y: auto; background: var(--surface); border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.3); display: none; }
.modal.open { display: block; }
.modal-head { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.modal-body { padding: 16px 18px; }
.modal-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.x { border: 0; background: none; cursor: pointer; font-size: 20px; line-height: 1; color: var(--ink-3); padding: 4px; }

.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
.kv .k { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.kv .v { font-size: 13px; }
.scorebox { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.scorebox > div { background: var(--surface-2); border-radius: var(--r); padding: 10px; text-align: center; }
.scorebox .big { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.lineage { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
.lineage a { word-break: break-all; }

/* Agent console */
.agent-log { font-family: var(--font-mono); font-size: 12px; background: var(--rail); color: #cfe3e0; border-radius: var(--r); padding: 12px 14px; max-height: 260px; overflow-y: auto; line-height: 1.6; }
.agent-log .t { color: #6f8790; }
.agent-log .ok { color: #7ee0a8; } .agent-log .wr { color: #f0b04a; } .agent-log .ag { color: #7fd6cc; }
.agent-card { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
.agent-card:hover { border-color: var(--accent); }
.agent-card .ic { width: 30px; height: 30px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.agent-card .ic svg { width: 16px; height: 16px; }
.agent-card.off { opacity: .55; }
.switch { position: relative; width: 34px; height: 20px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; cursor: pointer; transition: .15s; }
.switch span::after { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(14px); }
pre.prompt { white-space: pre-wrap; font-family: var(--font-mono); font-size: 12px; background: var(--surface-2); padding: 10px 12px; border-radius: var(--r); margin: 0; }

/* Stepper (planning assistant) */
.phases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.phase { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; gap: 10px; align-items: center; background: var(--surface); }
.phase .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface-2); flex: none; }
.phase.done { background: var(--good-soft); border-color: transparent; } .phase.done .n { background: var(--good); color: #fff; }
.phase.cur { background: var(--accent-soft); border-color: var(--accent); } .phase.cur .n { background: var(--accent); color: var(--accent-ink); }
.steps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-bottom: 14px; }
.step { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; font-size: 12px; background: var(--surface); cursor: pointer; text-align: left; }
.step .s { font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.step.done { background: var(--good-soft); border-color: transparent; }
.step.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.step[disabled] { cursor: not-allowed; opacity: .6; }
.output { border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; background: var(--surface); line-height: 1.6; }
.output h4 { margin: 12px 0 4px; font-size: 13px; }
.output ul, .output ol { margin: 4px 0; padding-left: 20px; }
.typing::after { content: '▍'; color: var(--accent); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Home */
.hero { background: var(--rail); color: #e4ecef; border-radius: 10px; padding: 26px 28px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; align-items: center; }
.hero h1 { font-size: 26px; color: #fff; }
.hero p { color: #a9bcc3; margin-top: 8px; max-width: 58ch; }
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.flow span.n { background: rgba(60,183,173,.16); color: #9fe3db; padding: 5px 9px; border-radius: 4px; }
.flow span.a { color: #5f737c; }
.mod { display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: box-shadow .15s; }
.mod:hover { box-shadow: var(--shadow); border-color: var(--accent); }
.mod .go { margin-top: auto; color: var(--accent); font-size: 13px; font-weight: 600; }
.mod .stat { font-size: 12px; color: var(--ink-2); }

.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--ink-2); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
.queue-item { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--r); background: var(--warn-soft); cursor: pointer; }
.queue-item.crit { background: var(--crit-soft); }
.queue-item.info { background: var(--info-soft); }
.queue-item .n { font-size: 18px; font-weight: 700; min-width: 26px; font-variant-numeric: tabular-nums; }
.spark { display: block; }

/* ---------- Scoring rules ---------- */
const inherent = r => r.L * r.I;
function residual(r) { const b = CONTROL_BANDS.find(x => x.key === r.band); return b && b.reduction != null ? Math.round(inherent(r) * (1 - b.reduction)) : null; }
const currentScore = r => residual(r) ?? inherent(r);
function appetiteOf(score) {
  const t = S.settings.threshold;
  if (score == null) return 'unjudged';
  if (score >= t) return 'above';
  if (score >= t - S.settings.nearBuffer) return 'near';
  return 'within';
}
const appetite = (r, view) => appetiteOf(view === 'inherent' ? inherent(r) : currentScore(r));
const sevClass = a => a === 'above' ? 'crit' : a === 'near' ? 'warn' : 'good';
const appPill = a => `<span class="pill ${sevClass(a)}">${a === 'above' ? 'Above appetite' : a === 'near' ? 'Near' : 'Within'}</span>`;
const activeRisks = () => S.risks.filter(r => r.status === 'Active');
const riskById = id => S.risks.find(r => r.id === id);
const auditById = id => S.audits.find(a => a.id === id);
const auditsFor = rid => S.audits.filter(a => a.risks.includes(rid));
const covered = rid => auditsFor(rid).length > 0;
function isOverdue(i) { return !String(i.status).startsWith('Closed') && i.status !== 'Draft' && i.due < ORG.asOf; }
function issueStatus(i) { return isOverdue(i) ? 'Overdue' : i.status; }
function nextId(prefix, list, key = 'id', pad = 4) {
  const nums = list.map(x => parseInt(String(x[key]).split('-').pop(), 10)).filter(n => !isNaN(n));
  return `${prefix}-${String(Math.max(0, ...nums) + 1).padStart(pad, '0')}`;
}

/* =====================================================================
   AGENT RUNTIME
   simulated: returns deterministic demo output after a short delay.
   live (phase 2): POSTs {agent, system, input} to the backend, which
   calls the LLM, validates JSON against the agent's output schema and
   returns {output, usage, traceId}. The UI code does not change.
   ===================================================================== */
const AgentRuntime = {
  endpoint: '/api/agents/run',
  async run(agentId, input, sim) {
    const a = AGENTS.find(x => x.id === agentId);
    const st = S.agents[agentId];
    if (!st.enabled) { toast(`${a.name} is switched off. Turn it on in the Agent control centre.`, 'warn'); throw new Error('agent disabled'); }
    const t0 = performance.now();
    let output;
    if (S.settings.runtime === 'live') {
      const res = await fetch(this.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ agent: a.id, system: st.prompt.replace('{org}', ORG.name), input }) });
      if (!res.ok) throw new Error(`Agent backend returned ${res.status}`);
      output = (await res.json()).output;
    } else {
      await sleep(sim.ms ?? 900);
      output = sim.output();
    }
    st.runs += 1; st.last = nowStr();
    logRun(a.name, sim.log || 'Run completed', 'ok');
    save();
    return { output, ms: Math.round(performance.now() - t0) };
  }
};

function tabs(route, active, list) {
  return `<div class="tabs" role="tablist">${list.map(([id, label, badge]) => `<button class="tab ${active === id ? 'active' : ''}" role="tab" data-act="tab" data-route="${route}" data-tab="${id}">${label}${badge ? ` <span class="pill crit" style="margin-left:4px">${badge}</span>` : ''}</button>`).join('')}</div>`;
}
ACT.tab = el => { setTab(el.dataset.route, el.dataset.tab); render(); };
function kpi(label, val, sub, cls = '', go = '', tab = '') {
  return `<div class="card kpi ${cls}" ${go ? `data-go="${go}"` : ''} ${tab ? `data-tab="${tab}"` : ''}><div class="label">${label}</div><div class="val">${val}</div><div class="small faint">${sub}</div></div>`;
}
function scoreCell(score, a) { return score == null ? '<span class="faint mono">N/A</span>' : `<span class="score ${sevClass(a)}">${score}</span>`; }
function spark(vals, w = 120, h = 32, color = 'var(--accent)') {
  const max = Math.max(...vals), min = Math.min(...vals), rng = max - min || 1;
  const pts = vals.map((v, i) => [i * (w - 6) / (vals.length - 1) + 3, h - 4 - (v - min) / rng * (h - 8)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${d} L${last[0]} ${h} L3 ${h} Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/></svg>`;
}
function catDot(l1) { return `<span class="pill outline"><span class="dot" style="color:${L1_COLORS[l1]}"></span>${esc(l1.replace(' Risks', ''))}</span>`; }

function sensingRegister() {
  const q = S.ui.search.toLowerCase(), cat = S.ui.catFilter;
  const risks = activeRisks().filter(r => (!cat || r.l1 === cat) && (!q || (r.id + r.title + r.desc + r.owner).toLowerCase().includes(q)));
  const autos = S.runs.flatMap(run => run.candidates.filter(c => c.auto && !c.confirmed && c.decision === 'Merged').map(c => ({ ...c, run: run.id })));
  const unconf = activeRisks().filter(r => !r.confirmed);
  const stale = activeRisks().filter(r => r.sources.every(s => s.date < '2026-06-01'));
  const awaiting = S.runs.filter(r => r.status === 'Awaiting review');
  let body = `<div class="grid g4">
    ${kpi('Active', activeRisks().length, 'risks on the register', 'acc')}
    ${kpi('Above appetite', activeRisks().filter(r => appetite(r) === 'above').length, `threshold ${S.settings.threshold}`, 'crit', 'assessment', 'appetite')}
    ${kpi('Stale', stale.length, 'no new evidence since June', stale.length ? 'warn' : '')}
    ${kpi('Pending review', unconf.length + autos.length + pendingCandidates().length, 'confirmations and signal decisions', 'warn')}
  </div>`;
  if (awaiting.length) body += `<div class="banner warn mt">${icon('radar')} ${awaiting.length} run awaiting review with ${pendingCandidates().length} undecided signals<span class="spacer"></span><button class="btn sm" data-act="tab" data-route="sensing" data-tab="runs">Open runs to review →</button></div>`;
  if (autos.length || unconf.length) {
    body += `<div class="card mt" style="border-color:var(--info)"><div class="card-head"><h3 style="color:var(--info)">Recently auto-approved</h3><span class="small faint">${autos.length + unconf.length} pending confirmation</span></div><div class="stack" style="gap:8px">
    ${autos.map(c => { const r = riskById(c.match.risk); return `<div class="row between" style="border:1px solid var(--line);border-radius:6px;padding:10px 12px;flex-wrap:nowrap"><div><div class="small"><span class="id">${c.match.risk}</span> ${esc(r ? r.title : '')}</div><div class="tiny faint">Merged "${esc(c.title)}" (${pct(c.match.score)} match) by auto-merge rule · ${esc(c.agent)} · ${c.run}</div></div><div class="row" style="flex-wrap:nowrap"><button class="btn sm on" data-act="confirmAuto" data-cid="${c.cid}">Confirm</button><button class="btn sm" data-act="reverseAuto" data-cid="${c.cid}">Reverse</button></div></div>`; }).join('')}
    ${unconf.map(r => `<div class="row between" style="border:1px solid var(--line);border-radius:6px;padding:10px 12px;flex-wrap:nowrap"><div><div class="small"><span class="id">${r.id}</span> ${esc(r.title)}</div><div class="tiny faint">Created from "${esc(r.sources[0].agent)}" signal · ${r.identified}</div></div><div class="row" style="flex-wrap:nowrap"><button class="btn sm on" data-act="confirmRisk" data-id="${r.id}">Confirm</button><button class="btn sm" data-act="retireRisk" data-id="${r.id}">Undo</button></div></div>`).join('')}
    </div></div>`;
  }
  body += `<div class="card flush mt"><div class="row" style="padding:12px;gap:8px">
    <input type="search" placeholder="Search risks by title, ID, owner, description" value="${esc(S.ui.search)}" data-inp="search" id="riskSearch" style="flex:2;min-width:180px">
    <select data-chg="catFilter" style="flex:1;min-width:150px" aria-label="Category"><option value="">All categories</option>${Object.keys(TAXONOMY).map(k => `<option ${cat === k ? 'selected' : ''}>${k}</option>`).join('')}</select>
    <span class="small faint">${risks.length} of ${activeRisks().length}</span><button class="btn sm" data-act="exportRegister">${icon('copy')} Copy as CSV</button></div>
    <div class="table-wrap"><table><thead><tr><th>ID</th><th>Risk</th><th>Category / Sub</th><th>Data sources</th><th>Inherent</th><th>Residual</th></tr></thead><tbody>`;
  Object.keys(TAXONOMY).forEach(l1 => {
    const grp = risks.filter(r => r.l1 === l1);
    if (!grp.length) return;
    const res = grp.map(residual).filter(x => x != null);
    const ab = grp.filter(r => appetite(r) === 'above').length;
    body += `<tr class="group"><td colspan="6"><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${L1_COLORS[l1]};margin-right:6px"></span>${l1} · ${grp.length} risks${res.length ? ` · avg residual ${Math.round(res.reduce((a, b) => a + b, 0) / res.length)}` : ''}${ab ? ` · <span style="color:var(--crit)">${ab} above appetite</span>` : ''}</td></tr>`;
    grp.forEach(r => {
      const a = appetite(r), types = [...new Set(r.sources.map(s => s.type))];
      body += `<tr class="clickable ${a === 'above' ? 'stripe-crit' : a === 'near' ? 'stripe-warn' : ''}" data-act="openRisk" data-id="${r.id}">
        <td class="mono small">${r.id}</td>
        <td style="min-width:260px"><div>${esc(r.title)} ${r.confirmed ? '' : '<span class="pill info">Awaiting confirmation</span>'}</div><div class="small faint" style="max-width:52ch">${esc(r.desc.slice(0, 120))}…</div></td>
        <td class="small">${esc(r.l1.replace(' Risks', ''))}<div class="faint">${esc(r.l2)}</div></td>
        <td><div class="row" style="gap:4px">${types.map(t => `<span class="pill outline">${esc(t)}${r.sources.filter(s => s.type === t).length > 1 ? ` (${r.sources.filter(s => s.type === t).length})` : ''}</span>`).join('')}</div></td>
        <td>${scoreCell(inherent(r), appetiteOf(inherent(r)))}<div class="tiny faint">${a === 'above' ? 'Above' : ''}</div></td>
        <td>${scoreCell(residual(r), a)}</td></tr>`;
    });
  });
  body += `</tbody></table></div></div>`;
  return body;
}

ACT.confirmAuto = el => { S.runs.forEach(run => run.candidates.forEach(c => { if (c.cid === el.dataset.cid) { c.confirmed = true; logDecision('Confirmed auto-merge', c.match.risk, c.title); } })); save(); render(); toast('Auto-merge confirmed. The source stays on the register risk.'); };
ACT.reverseAuto = el => {
  S.runs.forEach(run => run.candidates.forEach(c => {
    if (c.cid !== el.dataset.cid) return;
    const r = riskById(c.match.risk);
    if (r) { r.sources = r.sources.filter(s => s.cand !== c.cid && s.ref !== c.source); r.history.unshift({ at: nowStr(), who: ME, what: `Reversed auto-merge of "${c.title}"` }); }
    c.decision = 'Rejected'; c.auto = false; c.confirmed = true;
    logDecision('Reversed auto-merge', c.match.risk, c.title);
  }));
  save(); render(); toast('Auto-merge reversed and logged');
};
ACT.confirmRisk = el => { const r = riskById(el.dataset.id); r.confirmed = true; r.history.unshift({ at: nowStr(), who: ME, what: 'Confirmed on register' }); logDecision('Confirmed new risk', r.id); save(); render(); toast(`${r.id} confirmed`); };
ACT.retireRisk = el => { const r = riskById(el.dataset.id); r.status = 'Retired'; r.history.unshift({ at: nowStr(), who: ME, what: 'Removed from register (undo of auto-create)' }); logDecision('Undid auto-created risk', r.id); save(); render(); toast(`${r.id} removed from the active register`); };

    if (q === 'evidence') return `It rests on ${r.sources.length} source${r.sources.length > 1 ? 's' : ''}: ` + r.sources.map(s => `${s.type} from ${s.agent} (${pct(s.conf)} confidence, ${s.date})`).join('; ') + `. No source is older than ${r.sources.map(s => s.date).sort()[0]}.`;
    return others.length ? `Within ${r.l1}, ${r.id} scores ${currentScore(r)} against ${others.map(o => `${o.id} at ${currentScore(o)}`).join(', ')}. ` + (others.some(o => o.l2 === r.l2) ? `It shares the subcategory ${r.l2} with ${others.filter(o => o.l2 === r.l2).map(o => o.id).join(', ')}; check for overlap before the next run.` : `No other risk shares its subcategory, so there is no duplicate.`) : `It is the only active risk in ${r.l1}.`;
  } });
  out.innerHTML = `<div class="output small">${aiTag('Assistant')} <p style="margin-top:6px">${esc(output)}</p><p class="tiny faint mt">Generated from the register record only. Verify before relying on it.</p></div>`;

/* ---- Sensing run (multi-agent) ---- */
ACT.runSensing = async () => {
  const sensors = ['threats', 'scandals', 'regulations', 'market'].filter(id => S.agents[id].enabled);
  if (!S.agents.consolidate.enabled) { toast('Consolidation Agent is off. Turn it on in the Agent control centre.', 'warn'); return; }
  if (!sensors.length) { toast('All sensing agents are switched off', 'warn'); return; }
  const c = consoleModal('Sensing run in progress');
  const pool = [...SIGNAL_POOL].sort(() => Math.random() - 0.5);
  const found = [];
  for (const id of sensors) {
    const a = AGENTS.find(x => x.id === id);
    c.line(a.name, 'reading sources…');
    const picks = pool.filter(p => p.agent === a.name).slice(0, 1);
    const { output } = await AgentRuntime.run(id, { since: 'last run' }, { ms: 650, log: `${picks.length} candidate(s)`, output: () => picks });
    output.forEach(p => found.push(p));
    c.line(a.name, `${Math.floor(Math.random() * 150) + 30} items read · ${output.length} candidate${output.length === 1 ? '' : 's'}`, output.length ? 'ok' : '');
  }
  if (!found.length) found.push(pool[0]);
  c.line('Consolidation Agent', `matching ${found.length} candidates to ${activeRisks().length} register risks…`);
  const { output: cands } = await AgentRuntime.run('consolidate', { candidates: found.length }, { ms: 900, log: `${found.length} candidates routed`, output: () => found.map((p, i) => {
    const score = [0.86, 0.68, 0.44, 0.61, 0.9, 0.38][(i + Math.floor(Math.random() * 6)) % 6];
    return { cid: `CAN-${400 + S.runs.length * 10 + i}`, title: p.title, desc: p.desc, l1: p.l1, l2: p.l2, agent: p.agent, conf: +(0.62 + Math.random() * 0.3).toFixed(2), severity: p.severity,
      match: { risk: p.near, score }, source: `https://signals.example/${p.agent.split(' ')[0].toLowerCase()}/${Date.now() % 100000}`, decision: null };
  }) });
  const am = S.settings.autoMerge;
  cands.forEach(cd => { if (cd.match.score >= am) { cd.decision = 'Merged'; cd.auto = true; applyMerge(cd, true); c.line('Consolidation Agent', `auto-merged "${cd.title}" into ${cd.match.risk} (${pct(cd.match.score)})`, 'ok'); } else if (cd.match.score >= S.settings.reviewFloor) c.line('Consolidation Agent', `partial match ${pct(cd.match.score)} → reviewer decision: "${cd.title}"`, 'wr'); else c.line('Consolidation Agent', `no strong match → proposed as new risk: "${cd.title}"`, 'wr'); });
  S.runs.unshift({ id: `RUN-${ORG.asOf}-${String(S.runs.length + 1).padStart(2, '0')}`, name: 'External research, on-demand run', started: nowStr(), status: cands.some(x => !x.decision) ? 'Awaiting review' : 'Completed', candidates: cands });
  S.ui.sensingTab = 'runs'; save();
  c.line('Orchestrator', 'run complete. Open the review to decide.', 'ok'); c.done('Review signals');
  render();
};
function applyMerge(c, auto) {
  const r = riskById(c.match.risk); if (!r) return;
  r.sources.push({ type: c.agent.includes('Extractor') ? 'Document' : 'External risk', agent: c.agent, conf: c.conf, date: ORG.asOf, finding: c.desc, ref: c.source, cand: c.cid });
  r.history.unshift({ at: nowStr(), who: auto ? 'Consolidation Agent (auto-merge)' : ME, what: `Merged signal "${c.title}" (${pct(c.match.score)} match)` });
}

function sensingRuns() {
  if (!S.runs.length) return '<div class="empty">No runs yet.</div>';
  const run = S.runs.find(r => r.status === 'Awaiting review') || S.runs[0];
  const cnt = k => run.candidates.filter(c => c.decision === k).length;
  const am = S.settings.autoMerge, rf = S.settings.reviewFloor;
  const partial = run.candidates.filter(c => !c.auto && c.match.score >= rf);
  const fresh = run.candidates.filter(c => !c.auto && c.match.score < rf);
  const done = run.candidates.filter(c => c.auto);
  const undecided = run.candidates.filter(c => !c.decision).length;
  const others = S.runs.filter(r => r !== run);
  return `<div class="card"><div class="row between"><div><h3>${esc(run.name)}</h3><div class="id">${run.id} · started ${run.started} · ${run.candidates.length} signals</div></div>${run.status === 'Completed' ? '<span class="pill good">Completed</span>' : '<span class="pill warn">Awaiting review</span>'}</div>
    <div class="row mt"><span class="small muted">Run summary</span><span class="pill good">${cnt('Created')} Created</span><span class="pill acc">${cnt('Merged')} Merged</span><span class="pill warn">${cnt('Monitor')} Monitored</span><span class="pill crit">${cnt('Rejected')} Rejected</span><span class="pill">${undecided} Undecided</span></div>
    <p class="tiny faint mt">Routing rule: match ≥ ${pct(am)} auto-merges, ${pct(rf)} to ${Math.round(am * 100) - 1}% needs your decision, below ${pct(rf)} is proposed as a new risk. Change thresholds in the Agent control centre.</p></div>
  <div class="banner info mt">${icon('bot')} <span>Not sure about a signal? Select <b>Ask the assistant</b> on its card to see why it was flagged and how it compares with the register.</span></div>
  ${partial.length ? `<h3 class="mt2">Possible matches: needs your decision <span class="pill">${partial.length}</span></h3><p class="small faint" style="margin-bottom:10px">Partial match to an existing risk. Merge adds the evidence to that risk; Monitor parks it on the watchlist; Reject discards it with a note.</p><div class="stack">${partial.map(c => candCard(c, run, 'match')).join('')}</div>` : ''}
  ${fresh.length ? `<h3 class="mt2">Proposed new risks <span class="pill">${fresh.length}</span></h3><p class="small faint" style="margin-bottom:10px">No strong match on the register. Create adds a new risk awaiting scoring.</p><div class="stack">${fresh.map(c => candCard(c, run, 'new')).join('')}</div>` : ''}
  ${done.length ? `<h3 class="mt2">Already decided <span class="pill">${done.length}</span></h3><p class="small faint" style="margin-bottom:10px">Auto-merged by the consolidation rule. Listed so you can see everything this run found; reverse from the register if needed.</p><div class="stack">${done.map(c => candCard(c, run, 'done')).join('')}</div>` : ''}
  ${run.status === 'Awaiting review' ? `<div class="card mt row between" style="position:sticky;bottom:0;box-shadow:var(--shadow)"><span class="small">${run.candidates.length - undecided} of ${run.candidates.length} decided</span><div class="row"><button class="btn" data-act="tab" data-route="sensing" data-tab="register">Save progress</button><button class="btn primary" data-act="completeRun" data-run="${run.id}" ${undecided ? 'disabled title="Decide every signal first"' : ''}>Complete review</button></div></div>` : ''}
  ${others.length ? `<h3 class="mt2">Earlier runs</h3><div class="card flush mt"><table><tbody>${others.map(r => `<tr><td class="mono small">${r.id}</td><td>${esc(r.name)}</td><td class="small faint">${r.candidates.length} signals</td><td><span class="pill ${r.status === 'Completed' ? 'good' : 'warn'}">${r.status}</span></td></tr>`).join('')}</tbody></table></div>` : ''}`;
}
function candCard(c, run, kind) {
  const r = riskById(c.match.risk);
  const locked = run.status === 'Completed' || kind === 'done';
  const btn = (k, label) => `<button class="btn sm ${c.decision === k ? 'on' : ''}" data-act="decide" data-run="${run.id}" data-cid="${c.cid}" data-d="${k}" ${locked ? 'disabled' : ''}>${label}</button>`;
  return `<div class="cand ${c.decision ? 'decided' : ''}"><div>
    <div class="row"><b>${esc(c.title)}</b><span class="pill outline">${esc(c.agent)}</span>${c.auto ? '<span class="pill info">Auto-merged</span>' : `<span class="pill warn">${kind === 'new' ? 'New risk proposal' : 'Review match'} · ${pct(c.match.score)}</span>`}<span class="pill">${pct(c.conf)} confidence</span><span class="pill ${c.severity === 'high' ? 'crit' : 'warn'}">${c.severity}</span></div>
    <p class="small muted" style="margin-top:6px">${esc(c.desc)}</p>
    <div class="ev"><span>${esc(c.title)}</span><span class="faint">${/^https?:/.test(c.source) ? esc(c.source.replace(/^https?:\/\//, '')) : esc(c.source)}</span></div>
    <div class="row mt small"><span class="faint">Category</span>${catDot(c.l1)}<span class="pill outline">${esc(c.l2)}</span>${aiTag('AI mapping')}</div>
    ${r ? `<div class="row mt small"><span class="faint">${kind === 'new' ? 'Nearest' : 'Matches'}:</span> <span class="id">${r.id}</span> ${esc(r.title)} <span class="matchbar"><span style="width:${c.match.score * 100}%"></span></span> ${pct(c.match.score)}</div>` : ''}
    ${!locked ? `<div class="field mt"><label for="note-${c.cid}">Approval notes (optional)</label><input type="text" id="note-${c.cid}" value="${esc(c.note || '')}" data-inp="candNote" data-run="${run.id}" data-cid="${c.cid}" placeholder="Reason for your decision"></div>` : ''}
  </div><div class="actions">
    <button class="btn sm" data-act="askCand" data-run="${run.id}" data-cid="${c.cid}">${icon('bot', 12)} Ask the assistant</button>
    ${kind === 'new' ? btn('Created', 'Create') : btn('Merged', 'Merge')}${btn('Monitor', 'Monitor')}${btn('Rejected', 'Reject')}

INP.candNote = el => { const run = S.runs.find(r => r.id === el.dataset.run); const c = run.candidates.find(x => x.cid === el.dataset.cid); c.note = el.value; save(); };
ACT.decide = el => { const run = S.runs.find(r => r.id === el.dataset.run); const c = run.candidates.find(x => x.cid === el.dataset.cid); c.decision = c.decision === el.dataset.d ? null : el.dataset.d; save(); render(); };
ACT.askCand = async el => {
  const run = S.runs.find(r => r.id === el.dataset.run); const c = run.candidates.find(x => x.cid === el.dataset.cid); const r = riskById(c.match.risk);
  openModal(`Assistant · ${esc(c.title)}`, `<div class="row small faint"><span class="spinner"></span> Comparing with the register…</div>`);

    r ? `Closest register risk: ${r.id} ${r.title} (${pct(c.match.score)} similarity). Overlap is on ${c.l2 === r.l2 ? 'the same subcategory (' + r.l2 + ')' : 'the consequence, but the subcategory differs (' + c.l2 + ' vs ' + r.l2 + ')'}.` : 'No close register risk.',
    c.match.score >= S.settings.reviewFloor ? `Suggested decision: ${c.l2 === (r && r.l2) ? 'Merge, since cause and subcategory match.' : 'Monitor or create separately, since the cause differs and merging would hide a distinct exposure.'}` : 'Suggested decision: Create as a new risk if the firm has the same exposure; otherwise Reject with a note.',
    'This is a suggestion. Your decision is recorded in the decision log.'] });
  openModal(`Assistant · ${esc(c.title)}`, `${aiTag('Assistant')}<ul class="small" style="padding-left:18px;margin-top:8px">${output.map(o => `<li style="margin-bottom:6px">${esc(o)}</li>`).join('')}</ul>`, `<button class="btn" data-act="closeModal">Close</button>`);
};
ACT.completeRun = el => {
  const run = S.runs.find(r => r.id === el.dataset.run);
  run.candidates.forEach(c => {
    if (c.auto || c.applied) return;
    if (c.decision === 'Merged') applyMerge(c, false);
    if (c.decision === 'Created') {
      const id = nextId('RISK', S.risks);
      const hi = c.severity === 'high';
      S.risks.push({ id, title: c.title, desc: c.desc, l1: c.l1, l2: c.l2, owner: PEOPLE.cro, L: 3, I: hi ? 4 : 3, band: 'Unknown', status: 'Active', confirmed: true, identified: ORG.asOf, velocity: hi ? 'High' : 'Medium',
        sources: [{ type: 'External risk', agent: c.agent, conf: c.conf, date: ORG.asOf, finding: c.desc, ref: c.source, cand: c.cid }], history: [{ at: nowStr(), who: ME, what: `Created from signal ${c.cid}${c.note ? ': ' + c.note : ''}` }] });
      c.createdId = id;
    }
    if (c.decision === 'Monitor') S.watchlist.push({ ...c, at: nowStr() });
    c.applied = true;
    logDecision(`Sensing decision: ${c.decision}`, c.createdId || c.match.risk, `${c.title}${c.note ? ' · ' + c.note : ''}`);
  });
  run.status = 'Completed'; save(); render(); toast('Review complete. Register updated and decisions logged.');
};

CHG.docUpload = async el => {
  const files = Array.from(el.files || []); if (!files.length) return;
  const c = consoleModal('Extracting documents');
  const cands = [];
  for (const f of files) {
    const isT = /transcript|interview/i.test(f.name);
    const agentId = isT ? 'transcript' : 'pyextract';
    const a = AGENTS.find(x => x.id === agentId);
    c.line(a.name, `reading ${f.name} (${Math.max(1, Math.round(f.size / 1024))} KB)…`);
    const { output } = await AgentRuntime.run(agentId, { file: f.name }, { ms: 800, log: `Extracted 1 signal from ${f.name}`, output: () => ({ cid: `CAN-U${Date.now() % 100000}`, title: `Finding extracted from ${f.name}`, desc: `Demo extraction: ${a.name} found a control weakness statement in ${f.name}. In live mode this holds the extracted text with a page reference.`, l1: 'Operational Risks', l2: TAXONOMY['Operational Risks'][0], agent: a.name, conf: 0.7, severity: 'medium', match: { risk: 'RISK-0102', score: 0.55 }, source: `${f.name}, p.1`, decision: null }) });
    cands.push(output); c.line(a.name, '1 signal proposed', 'ok');
  }
  S.runs.unshift({ id: `RUN-${ORG.asOf}-D${S.runs.length}`, name: 'Document upload', started: nowStr(), status: 'Awaiting review', candidates: cands });
  S.ui.sensingTab = 'runs'; save(); c.done('Review signals'); render();
};
function sensingTaxonomy() {

RENDER.assessment = () => {
  const tab = S.ui.assessTab;
  const head = `<div class="page-head"><div><h1>Risk assessment</h1><p class="sub">Score risks against your scoring criteria, visualise them on the heat map and tune appetite.</p></div>

  if (tab === 'criteria') return head + assessCriteria();
  if (tab === 'heatmap') return head + assessHeat();
  if (tab === 'appetite') return head + assessAppetite();
  return head + assessScoring();
};

function assessScoring() {
  const rs = activeRisks().sort((a, b) => currentScore(b) - currentScore(a));
  const above = rs.filter(r => appetite(r) === 'above').length, near = rs.filter(r => appetite(r) === 'near').length;
  return `<div class="grid g4">${kpi('Scored', rs.length, 'inherent score set', 'good')}${kpi('Residual pending', rs.filter(r => r.band === 'Unknown').length, 'control band not rated', 'warn')}${kpi('Above appetite', above, `threshold ${S.settings.threshold}`, 'crit')}${kpi('Near appetite', near, `within ${S.settings.nearBuffer} of threshold`, 'warn')}</div>
  <div class="grid mt" style="grid-template-columns:minmax(0,1fr) 260px">
    <div class="card flush"><div class="card-head" style="padding:14px 16px 0"><h3>Register risks</h3><span class="small faint">${rs.length} total</span></div>
      ${rs.map(r => { const a = appetite(r), p = S.ui.proposal[r.id]; return `<div style="border-top:1px solid var(--line);padding:12px 16px">
        <div class="row between" style="flex-wrap:wrap;align-items:flex-start"><div style="min-width:220px;flex:1"><div><span class="id">${r.id}</span> <b>${esc(r.title)}</b> ${appPill(a)}</div><div class="small faint">${esc(r.l2)} · ${esc(r.l1)} · ${esc(r.owner)}</div></div>
        <div class="row" style="flex-wrap:nowrap;gap:14px"><div style="text-align:center"><div class="tiny faint">Inherent</div>${scoreCell(inherent(r), appetiteOf(inherent(r)))}</div><div style="text-align:center"><div class="tiny faint">Residual</div>${scoreCell(residual(r), a)}</div>
        <button class="btn sm" data-act="aiScore" data-id="${r.id}">${icon('spark', 12)} AI</button><button class="btn sm" data-act="scoreModal" data-id="${r.id}">Score</button><button class="btn sm" data-act="residualModal" data-id="${r.id}">Residual</button></div></div>
        ${p ? proposalPanel(r, p) : ''}</div>`; }).join('')}
    </div>
    <div class="stack"><div class="card"><h4>Inherent heat map</h4><div class="mt">${miniHeat()}</div><a class="small" href="#assessment" data-act="tab" data-route="assessment" data-tab="heatmap">Open →</a></div>
      <div class="card small muted"><h4 style="color:var(--ink)">How scoring works</h4><p class="mt">Inherent = likelihood × impact. Residual = inherent less the control band reduction (Limited 10%, Moderate 30%, Strong 50%), rounded. Unknown leaves residual N/A. Appetite reads the residual, or the inherent while residual is N/A, against the threshold (currently ${S.settings.threshold}).</p></div></div>
  </div>`;
}
function miniHeat() {
  let h = '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:3px">';
  for (let L = 5; L >= 1; L--) for (let I = 1; I <= 5; I++) { const n = activeRisks().filter(r => r.L === L && r.I === I).length; h += `<div class="cell" style="background:${heatColor(L * I)};aspect-ratio:1.4">${n ? `<span class="count" style="width:18px;height:18px;font-size:10px">${n}</span>` : ''}</div>`; }
  return h + '</div>';
}
function heatColor(s) { return s <= 3 ? 'var(--h1)' : s <= 6 ? 'var(--h2)' : s <= 10 ? 'var(--h3)' : s <= 16 ? 'var(--h4)' : 'var(--h5)'; }

function proposeScore(r) {
  const kriB = S.kris.some(k => k.risk === r.id && k.value > k.threshold);
  const L = Math.max(1, Math.min(5, Math.round(2 + r.sources.length * 0.5 + (kriB ? 1 : 0) + (r.velocity === 'High' ? 0.5 : 0))));
  const I = r.I;
  const conf = r.sources.reduce((s, x) => s + x.conf, 0) / r.sources.length;
  const Ld = S.scales.L.find(x => x.v === L), Id = S.scales.I.find(x => x.v === I);
  const counter = r.band === 'Strong' ? ['Controls rated Strong; residual exposure is low even if likelihood is high.'] : kriB ? [] : ['No KRI breach is linked to this risk.'];
  return { L, I, conf: Math.round(conf * 100) / 100,
    why: `Likelihood ${L} (${Ld.name}): ${Ld.desc.toLowerCase()} Evidence: ${r.sources.length} source${r.sources.length > 1 ? 's' : ''}${kriB ? ', including a breaching KRI' : ''}, velocity ${r.velocity.toLowerCase()}. Impact ${I} (${Id.name}): ${Id.desc.toLowerCase()}`,
    evidence: r.sources.map(s => `${s.finding} (${s.agent})`), counter };
}
function proposalPanel(r, p) {
  const same = p.L * p.I === inherent(r);
  return `<div class="output mt" style="background:var(--warn-soft);border-color:transparent">
    <div class="row between"><b>${aiTag()} AI score proposal</b><span class="pill">${pct(p.conf)} confidence</span></div>
    <div class="grid g3 mt"><div><div class="tiny faint">Likelihood</div>${p.L} · ${S.scales.L.find(x => x.v === p.L).name}</div><div><div class="tiny faint">Inherent impact</div>${p.I} · ${S.scales.I.find(x => x.v === p.I).name}</div><div><div class="tiny faint">Proposed inherent score</div><span class="mono">L${p.L} × I${p.I} = ${p.L * p.I}</span><div class="tiny faint">${same ? 'Matches the current inherent score.' : `Current is ${inherent(r)}; applying changes it.`}</div></div></div>
    <p class="small mt">${esc(p.why)}</p>
    <p class="tiny faint mt">The residual comes from the control band you choose; the AI does not propose it.</p>
    <h4>Supporting evidence</h4><ul class="small">${p.evidence.map(e => `<li>${esc(e)}</li>`).join('')}</ul>
    ${p.counter.length ? `<h4>Counter-signals</h4><ul class="small">${p.counter.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : '<p class="small faint">No counter-signals found.</p>'}
    <div class="row mt" style="justify-content:flex-end"><button class="btn sm" data-act="dismissProp" data-id="${r.id}">Dismiss</button><button class="btn sm primary" data-act="applyProp" data-id="${r.id}">Apply to risk</button></div></div>`;
}
ACT.aiScore = async el => {
  const r = riskById(el.dataset.id);
  el.innerHTML = '<span class="spinner"></span>'; el.disabled = true;
  try { const { output } = await AgentRuntime.run('scoring', { risk: r.id }, { ms: 900, log: `Proposed score for ${r.id}`, output: () => proposeScore(r) }); S.ui.proposal[r.id] = output; save(); } catch (e) { /* toast already shown */ }
  render();
};
ACT.aiScoreAll = async () => {
  const targets = activeRisks().filter(r => r.band === 'Unknown' || !r.confirmed);
  const c = consoleModal('Scoring agent: unassessed risks');
  for (const r of targets) { c.line('Scoring Agent', `scoring ${r.id}…`); try { const { output } = await AgentRuntime.run('scoring', { risk: r.id }, { ms: 450, log: `Proposed score for ${r.id}`, output: () => proposeScore(r) }); S.ui.proposal[r.id] = output; c.line('Scoring Agent', `${r.id}: L${output.L} × I${output.I} = ${output.L * output.I} (${pct(output.conf)})`, 'ok'); } catch (e) { c.line('Scoring Agent', 'agent is off', 'wr'); break; } }
  c.line('Orchestrator', `${targets.length} proposals ready. Review each one; nothing was applied.`, 'ok'); c.done(); S.ui.assessTab = 'scoring'; save(); render();
};
ACT.dismissProp = el => { delete S.ui.proposal[el.dataset.id]; logDecision('Dismissed AI score proposal', el.dataset.id); save(); render(); };
ACT.applyProp = el => {
  const r = riskById(el.dataset.id), p = S.ui.proposal[r.id];
  const before = inherent(r); r.L = p.L; r.I = p.I;
  r.history.unshift({ at: nowStr(), who: ME, what: `Applied AI score proposal: ${before} → ${inherent(r)}` });
  logDecision('Applied AI score proposal', r.id, `L${p.L} × I${p.I} = ${p.L * p.I}`);
  delete S.ui.proposal[r.id]; save(); render(); toast(`${r.id} scored ${inherent(r)}`);
};
function scoringForm(r, ctx) {

function assessHeat() {
  const mode = S.ui.heatMode, cat = S.ui.heatCat;
  const rs = activeRisks().filter(r => !cat || r.l1 === cat);
  const pos = r => { if (mode === 'inherent') return [r.L, r.I]; const res = residual(r); if (res == null) return [r.L, r.I]; const b = CONTROL_BANDS.find(x => x.key === r.band); return [Math.max(1, Math.round(r.L * (1 - b.reduction))), r.I]; };
  const t = S.settings.threshold;
  let g = `<div class="heat"><div></div>${S.scales.I.map(x => `<div class="hd">${x.name}</div>`).join('')}`;
  for (let L = 5; L >= 1; L--) {
    g += `<div class="rl">${S.scales.L[L - 1].name}</div>`;
    for (let I = 1; I <= 5; I++) {
      const here = rs.filter(r => { const p = pos(r); return p[0] === L && p[1] === I; });
      const sel = S.ui.heatSel === `${L}-${I}`;
      g += `<div class="cell ${L * I >= t ? 'above' : ''} ${here.length ? 'has' : ''} ${sel ? 'sel' : ''}" style="background:${heatColor(L * I)}" ${here.length ? `data-act="heatCell" data-k="${L}-${I}"` : ''} title="L${L} × I${I} = ${L * I}">${here.length ? `<span class="count">${here.length}</span>` : L * I}</div>`;
    }
  }
  g += `<div></div><div class="hd" style="grid-column:2/-1;text-align:center;padding-top:6px">Impact →</div></div>`;
  const sel = S.ui.heatSel ? rs.filter(r => { const p = pos(r); return `${p[0]}-${p[1]}` === S.ui.heatSel; }) : [];
  return `<div class="row between"><div class="row"><span class="small muted">Mode</span><button class="btn sm ${mode === 'inherent' ? 'on' : ''}" data-act="heatMode" data-m="inherent">Inherent</button><button class="btn sm ${mode === 'residual' ? 'on' : ''}" data-act="heatMode" data-m="residual">Residual</button></div>
    <select data-chg="heatCat" style="width:auto" aria-label="Category"><option value="">All categories</option>${Object.keys(TAXONOMY).map(k => `<option ${cat === k ? 'selected' : ''}>${k}</option>`).join('')}</select></div>
  <div class="grid g3 mt">${kpi('On grid', rs.length, 'risks plotted')}${kpi('Above appetite', rs.filter(r => (mode === 'inherent' ? inherent(r) : currentScore(r)) >= t).length, `dashed cells score ${t} or more`, 'crit')}${kpi('Unscored', 0, 'every risk has an inherent score')}</div>
  <div class="grid mt" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)"><div class="card"><div class="row" style="align-items:stretch;flex-wrap:nowrap"><div class="tiny faint" style="writing-mode:vertical-rl;transform:rotate(180deg);text-align:center">Likelihood →</div><div style="flex:1;overflow-x:auto">${g}</div></div>
    <p class="tiny faint mt">${mode === 'residual' ? 'Residual mode moves rated risks down the likelihood axis by the control band reduction; unrated risks stay at inherent.' : 'Inherent position before controls.'}</p></div>
  <div class="card"><h4>${sel.length ? `Cell L${S.ui.heatSel.split('-')[0]} × I${S.ui.heatSel.split('-')[1]}` : 'Pick a cell'}</h4>${sel.length ? `<div class="stack mt" style="gap:8px">${sel.map(r => `<div class="lineage clickable" data-act="openRisk" data-id="${r.id}" style="cursor:pointer"><span class="id">${r.id}</span><b class="small">${esc(r.title)}</b><span class="tiny faint">${esc(r.l1)} · current ${currentScore(r)}</span></div>`).join('')}</div>` : '<p class="small faint mt">Click a populated cell to see the risks it holds.</p>'}</div></div>`;
}
ACT.heatMode = el => { S.ui.heatMode = el.dataset.m; S.ui.heatSel = null; save(); render(); };
ACT.heatCell = el => { S.ui.heatSel = S.ui.heatSel === el.dataset.k ? null : el.dataset.k; save(); render(); };

function assessAppetite() {
  const v = S.ui.appetiteView, t = S.settings.threshold;
  const grp = k => activeRisks().filter(r => appetite(r, v) === k).sort((a, b) => (v === 'inherent' ? inherent(b) - inherent(a) : currentScore(b) - currentScore(a)));
  const list = (k, title, cls) => { const g = grp(k); return `<div class="card flush mt"><div class="card-head" style="padding:14px 16px 0"><h3 style="color:var(--${cls})">${title}</h3><span class="pill">${g.length}</span></div>${g.length ? `<table><tbody>${g.map(r => `<tr class="clickable" data-act="openRisk" data-id="${r.id}"><td class="mono small">${r.id}</td><td>${esc(r.title)}</td><td class="small faint">${esc(r.l1.replace(' Risks', ''))}</td><td class="small ${v === 'inherent' ? '' : 'faint'}">Inherent <b>${inherent(r)}</b></td><td class="small ${v === 'current' && residual(r) != null ? '' : 'faint'}">Residual <b>${residual(r) ?? 'N/A'}</b></td></tr>`).join('')}</tbody></table>` : `<p class="small faint" style="padding:0 16px 14px">None.</p>`}</div>`; };
  return `<div class="card"><h3>Composite-score threshold</h3><p class="small muted">A score at or above this value is above appetite. It drives the register pill, the dashed heat-map cells, the planning generator and the dashboard.</p>
    <div class="row mt" style="flex-wrap:nowrap"><span class="mono small">1</span><input type="range" min="1" max="25" value="${t}" data-chg="threshold" aria-label="Appetite threshold" id="thr"><span class="mono small">25</span><span class="small">Threshold</span><input type="number" min="1" max="25" value="${t}" data-chg="threshold" style="width:64px" aria-label="Threshold value"></div>
    <div class="row mt"><label class="small" for="nb">Near buffer</label><input type="number" id="nb" min="0" max="5" value="${S.settings.nearBuffer}" data-chg="nearBuffer" style="width:64px"><span class="tiny faint">Risks within this many points below the threshold are "near".</span></div>

function planSelection() {
  const c = S.ui.planConfig, fb = +c.fallback || S.settings.threshold, nb = +c.near || 0;
  const rs = activeRisks();
  const above = rs.filter(r => currentScore(r) >= fb);
  const near = nb > 0 ? rs.filter(r => currentScore(r) < fb && currentScore(r) >= fb - nb) : [];
  let pool = [...(c.above ? above : []), ...near];
  const excluded = pool.filter(r => covered(r.id));
  pool = pool.filter(r => !covered(r.id)).sort((a, b) => currentScore(b) - currentScore(a));

function auditRating(a) {
  if (a.status === 'Reported' && a.rating) return a.rating;
  const iss = S.issues.filter(i => i.audit === a.id && i.status !== 'Draft');
  const h = iss.filter(i => i.rating === 'High').length, m = iss.filter(i => i.rating === 'Medium').length;
  return h >= 2 ? 'Unsatisfactory' : h === 1 ? 'Needs improvement' : m ? 'Satisfactory with improvements' : 'Satisfactory';
}
const ratingColor = r => r === 'Unsatisfactory' ? 'crit' : r === 'Needs improvement' ? 'warn' : r.startsWith('Satisfactory with') ? 'info' : 'good';

};
function auditReport() {

  const bar = `<div class="row between no-print"><select data-chg="reportAudit" style="width:auto" aria-label="Audit">${auds.map(x => `<option value="${x.id}" ${x.id === a.id ? 'selected' : ''}>${x.id} · ${esc(x.title)}</option>`).join('')}</select>
    <div class="row">${gen ? `<button class="btn" data-act="copyReport">${icon('copy')} Copy report text</button>` : ''}<button class="btn ${gen ? '' : 'primary'}" data-act="genReport" data-id="${a.id}">${icon('spark')} ${gen ? 'Regenerate' : 'Generate report'}</button>${gen && a.status !== 'Reported' ? `<button class="btn primary" data-act="markReported" data-id="${a.id}">Issue final report</button>` : ''}</div></div>`;
  if (!gen) return bar + `<div class="card mt empty">Select <b>Generate report</b>. The Report Writer uses signed conclusions and approved issues for ${a.id}.</div>`;
  const fw = S.fieldwork[a.id] || {}, cs = auditControls(a).filter(c => fw[c.id]);
  const iss = S.issues.filter(i => i.audit === a.id && i.status !== 'Draft'), drafts = S.issues.filter(i => i.audit === a.id && i.status === 'Draft');
  const rating = auditRating(a), eff = cs.filter(c => fw[c.id].conclusion && fw[c.id].conclusion.result === 'Effective').length, inef = cs.filter(c => fw[c.id].conclusion && fw[c.id].conclusion.result !== 'Effective').length, open = cs.filter(c => !fw[c.id].conclusion).length;
  const cnt = k => iss.filter(i => i.rating === k).length;
  const summary = `We assessed ${cs.length || auditControls(a).length} key control${cs.length === 1 ? '' : 's'} over ${a.risks.map(id => riskById(id).title.toLowerCase()).join(' and ')}. ${eff} operated effectively${inef ? `; ${inef} did not operate as designed` : ''}${open ? `; ${open} not yet concluded` : ''}. ${iss.length ? `We raised ${iss.length} issue${iss.length > 1 ? 's' : ''} (${cnt('High')} high, ${cnt('Medium')} medium, ${cnt('Low')} low). The most significant: ${iss.sort((x, y) => ['High', 'Medium', 'Low'].indexOf(x.rating) - ['High', 'Medium', 'Low'].indexOf(y.rating))[0].title.toLowerCase()}.` : 'No issues were raised.'} ${iss.length ? `Management has agreed actions due between ${iss.map(i => i.due).sort()[0]} and ${iss.map(i => i.due).sort().pop()}.` : ''}`;
  return bar + `<article class="report-doc mt" id="reportDoc">
    <div class="tiny faint">${esc(ORG.name)} · Internal Audit · ${a.id} · ${a.status === 'Reported' ? 'Final' : 'Draft for management response'}</div>
    <h1 style="margin-top:6px">${esc(a.title)}</h1>

    <h2>Executive summary</h2><p>${esc(summary)}</p>
    <h2>Background and scope</h2><p>${a.risks.map(id => { const r = riskById(id); return `${r.id} ${esc(r.title)} is ${appetite(r)} appetite with a current score of ${currentScore(r)} (threshold ${S.settings.threshold}).`; }).join(' ')} The audit tested design and operating effectiveness of the key controls in the approved RCM.</p>
    <h2>Control results</h2><div class="table-wrap"><table><thead><tr><th>Control</th><th>Design</th><th>Operating effectiveness</th><th>Conclusion</th></tr></thead><tbody>${(cs.length ? cs : auditControls(a)).map(c => { const f = fw[c.id] || {}; const ex = f.toe && f.toe.results ? f.toe.results.filter(r => r.exc && r.review !== 'override').length : null; return `<tr><td class="small"><span class="id">${c.id}</span> ${esc(c.name)}</td><td class="small">${f.tod && f.tod.accepted ? (f.tod.results.some(x => !x.ok) ? 'Gap' : 'Effective') : 'Not concluded'}</td><td class="small">${ex == null ? 'Not tested' : `${ex} exception${ex === 1 ? '' : 's'} / ${f.samples.length}`}</td><td>${f.conclusion ? fwPill(f.conclusion.result) : '<span class="pill outline">Open</span>'}</td></tr>`; }).join('')}</tbody></table></div>
    <h2>Findings</h2>${iss.length ? iss.map(i => `<div class="lineage mt" style="padding:12px 14px"><div class="row between"><b>${i.id} · ${esc(i.title)}</b>${ratingPill(i.rating)}</div><p class="small"><b>Condition.</b> ${esc(i.condition)}</p><p class="small"><b>Criteria.</b> ${esc(i.criteria)}</p><p class="small"><b>Cause.</b> ${esc(i.cause)}</p><p class="small"><b>Consequence.</b> ${esc(i.consequence)}</p><p class="small"><b>Management action.</b> ${esc(i.action)} <span class="faint">Owner ${esc(i.owner)}, due ${i.due}.</span></p></div>`).join('') : '<p class="small">No findings.</p>'}

/* ---- js/governance.js ---- */
/* =====================================================================
   Governance layer (v2.1): the enterprise audit-management features that
   commercial platforms treat as table stakes, built clean-room from
   public feature descriptions.
     1. Users, roles and segregation of duties (preparer / reviewer / approver)
     2. Workpaper review notes and two-level sign-off
     3. Evidence requests (PBC) to control owners, with reminders and ageing
     4. Time and budget: hours by phase, estimate at completion, utilisation
     5. Framework crosswalk: test once, map to many frameworks
   ===================================================================== */

/* ---------- 1. Users and segregation of duties ---------- */
const USERS = () => [
  { key: 'snr', name: PEOPLE.snr, role: 'Preparer' },
  { key: 'mgr', name: PEOPLE.mgr, role: 'Reviewer' },
  { key: 'cae', name: PEOPLE.cae, role: 'Approver' }
];
let currentUserKey = 'mgr';
function setUser(k) {
  const u = USERS().find(x => x.key === k) || USERS()[1];
  currentUserKey = u.key; ME = u.name;
  try { localStorage.setItem('auditos.user', u.key); } catch (e) { /* storage unavailable */ }
}
const myRole = () => (USERS().find(u => u.key === currentUserKey) || {}).role;
const canReview = () => ['Reviewer', 'Approver'].includes(myRole());
CHG.user = el => { setUser(el.value); closeDrawer(); closeModal(); renderShell(); render(); toast(`Signed in as ${ME} (${myRole()})`); };

/* ---------- Date helpers ---------- */
function addDays(iso, n) { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000); }
const today = () => ORG.asOf;

/* ---------- State migration: adds v2.1 keys to saved v1 state ---------- */
function migrate(s) {
  AGENTS.forEach(a => { if (!s.agents[a.id]) s.agents[a.id] = { enabled: true, runs: 0, last: '-', prompt: a.prompt }; });
  if (!s.requests) s.requests = seedRequests(s);
  if (!s.reviewNotes) s.reviewNotes = seedNotes();
  if (!s.time) s.time = seedTime(s);
  if (!s.mappings) s.mappings = {};
  s.ui.reqAudit = s.ui.reqAudit || 'AUD-2027-018';
  s.ui.reqFilter = s.ui.reqFilter || 'open';
  s.ui.fwFilter = s.ui.fwFilter || '';
  return s;
}

/* ---------- 2. Review notes and sign-off ---------- */
function seedNotes() {
  return [{ id: 'RN-001', audit: 'AUD-2027-018', control: 'C-06', by: PEOPLE.mgr, at: `${addDays(ORG.asOf, -1)} 17:20`, status: 'Open',
    text: 'Sample 7: confirm whether a documented delegate existed during the engineer\'s leave before you treat this as an operating exception rather than a design gap.', response: null }];
}
const notesFor = (aid, cid) => S.reviewNotes.filter(n => n.audit === aid && (!cid || n.control === cid));
const openNotes = (aid, cid) => notesFor(aid, cid).filter(n => n.status !== 'Cleared');
function signPill(f, aid, cid) {
  const n = openNotes(aid, cid).length;
  const so = f.signoffs || {};
  return (so.rev ? '<span class="pill good" title="Preparer and reviewer signed">Reviewed</span>' : so.prep ? '<span class="pill info" title="Awaiting reviewer sign-off">Prepared</span>' : '') +
    (n ? `<span class="pill warn" title="Open review notes">${n} note${n > 1 ? 's' : ''}</span>` : '');
}

  return `<div class="card mt"><div class="row between"><div><h3>Review and sign-off</h3><p class="small faint">Two-level sign-off with segregation of duties. Signed in as <b>${esc(ME)}</b> · ${myRole()}. Switch user in the top bar to act as preparer or reviewer.</p></div></div>
    <div class="row mt" style="align-items:stretch">
      ${step('1. Preparer sign-off', so.prep, !so.prep ? `<button class="btn sm primary mt" data-act="signPrep" ${f.conclusion ? '' : 'disabled title="Sign the conclusion first"'}>Sign as preparer</button>` : (!so.rev && so.prep.by === ME ? '<button class="btn sm mt" data-act="unsignPrep">Withdraw sign-off</button>' : ''))}
      ${step('2. Reviewer sign-off', so.rev, !so.rev ? `<button class="btn sm primary mt" data-act="signRev" ${revBlockers.length ? 'disabled' : ''}>Sign as reviewer</button>${revBlockers.length ? `<ul class="tiny faint" style="padding-left:16px;margin:6px 0 0">${revBlockers.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}` : '')}
    </div>
    <h4 class="mt2">Review notes <span class="small faint">${open.length} open of ${notes.length}</span></h4>
    ${notes.length ? notes.map(n => `<div class="lineage mt" style="padding:12px 14px"><div class="row between"><span class="id">${n.id} · raised by ${esc(n.by)} · ${n.at}</span><span class="pill ${n.status === 'Open' ? 'crit' : n.status === 'Addressed' ? 'warn' : 'good'}">${n.status}</span></div>
      <p class="small" style="margin:4px 0">${esc(n.text)}</p>
      ${n.response ? `<div class="small" style="border-left:3px solid var(--line);padding-left:8px"><b>Response</b> (${esc(n.respBy)}, ${n.respAt}): ${esc(n.response)}</div>` : ''}

        ${n.status === 'Addressed' ? `<button class="btn sm primary" data-act="clearNote" data-id="${n.id}" ${canReview() && n.respBy !== ME ? '' : 'disabled title="Only a reviewer who did not write the response can clear"'}>Clear</button><button class="btn sm" data-act="reopenNote" data-id="${n.id}" ${canReview() ? '' : 'disabled'}>Reopen</button>` : ''}</div></div>`).join('') : '<p class="small faint">No review notes on this workpaper.</p>'}
    <div class="field mt2"><label for="rn-new">Raise a review note</label><textarea id="rn-new" placeholder="${canReview() ? 'What must the preparer fix or explain?' : 'Only reviewers and approvers raise notes'}" ${canReview() ? '' : 'disabled'}></textarea></div>
    <div class="row mt" style="justify-content:flex-end"><button class="btn" data-act="raiseNote" ${canReview() ? '' : 'disabled'}>Raise note</button></div></div>`;
}
const fwCur = () => ({ a: auditById(S.ui.fwAudit), cid: S.ui.fwControl, f: S.fieldwork[S.ui.fwAudit][S.ui.fwControl] });
ACT.signPrep = () => { const { a, cid, f } = fwCur(); f.signoffs = { prep: { by: ME, at: nowStr() } }; logDecision('Signed workpaper as preparer', `${a.id}/${cid}`); save(); render(); toast('Signed as preparer'); };

  const { a, cid, f } = fwCur();
  if (!f.signoffs || !f.signoffs.prep || f.signoffs.prep.by === ME || !canReview() || openNotes(a.id, cid).length) { toast('Reviewer sign-off is blocked', 'warn'); return; }
  f.signoffs.rev = { by: ME, at: nowStr() }; logDecision('Signed workpaper as reviewer', `${a.id}/${cid}`, `preparer ${f.signoffs.prep.by}`); save(); render(); toast('Workpaper reviewed');
};

ACT.clearNote = el => { const n = S.reviewNotes.find(x => x.id === el.dataset.id); Object.assign(n, { status: 'Cleared', clearedBy: ME, clearedAt: nowStr() }); logDecision('Cleared review note', `${n.audit}/${n.control}`, n.id); save(); render(); };
ACT.reopenNote = el => { const n = S.reviewNotes.find(x => x.id === el.dataset.id); n.status = 'Open'; logDecision('Reopened review note', `${n.audit}/${n.control}`, n.id); save(); render(); };

/* Quality gate used before a final report is issued */
function issueGate(a) {
  const fw = S.fieldwork[a.id]; if (!fw) return [];
  const out = [];
  auditControls(a).filter(c => fw[c.id]).forEach(c => {
    const f = fw[c.id], so = f.signoffs || {};
    if (!f.conclusion) out.push(`${c.id}: conclusion not signed`);
    else if (!so.prep) out.push(`${c.id}: no preparer sign-off`);
    else if (!so.rev) out.push(`${c.id}: no reviewer sign-off`);
    const n = openNotes(a.id, c.id).length; if (n) out.push(`${c.id}: ${n} review note${n > 1 ? 's' : ''} not cleared`);
  });
  const reqs = S.requests.filter(r => r.audit === a.id && r.status !== 'Accepted');
  if (reqs.length) out.push(`${reqs.length} evidence request${reqs.length > 1 ? 's' : ''} not accepted (${reqs.map(r => r.id).join(', ')})`);
  return out;
}

/* ---------- 3. Evidence requests (PBC) ---------- */
const REQ_STATUSES = ['Draft', 'Sent', 'Submitted', 'Returned', 'Accepted'];
const reqOverdue = r => ['Sent', 'Returned'].includes(r.status) && r.due < today();
const reqStatus = r => reqOverdue(r) ? 'Overdue' : r.status;
const reqPill = s => `<span class="pill ${{ Draft: 'outline', Sent: 'info', Submitted: 'warn', Returned: 'crit', Accepted: 'good', Overdue: 'crit' }[s]}">${s === 'Submitted' ? 'Awaiting review' : s}</span>`;
function reqTemplates(c) {
  const n = c.nature === 'Automated' ? 1 : SAMPLE_SIZES[c.freq] || 5;
  return [
    { title: `${c.id} procedure and walkthrough evidence`, desc: `Current procedure for "${c.name}", the RACI or delegation for ${c.owner}, and the evidence produced for one walkthrough instance.` },
    { title: `${c.id} population and ${n} sample${n > 1 ? 's' : ''}`, desc: `System-generated population of every ${c.freq.toLowerCase()} instance in the audit period with the report parameters, then the sign-off evidence for the ${n} selected sample${n > 1 ? 's' : ''}.` }
  ];
}
function seedRequests(s) {
  const a = (s.audits || SEED_AUDITS).find(x => x.id === 'AUD-2027-018');
  if (!a) return [];
  const out = []; let k = 1;
  const plan = [['Accepted', -24, -14], ['Accepted', -24, -12], ['Submitted', -10, -1], ['Sent', -10, -3], ['Returned', -10, 2], ['Sent', -3, 5]];
  auditControls(a).forEach((c, ci) => reqTemplates(c).forEach((t, ti) => {
    const [status, req, due] = plan[(ci * 2 + ti) % plan.length];
    const id = `PBC-${String(k++).padStart(3, '0')}`, requested = addDays(ORG.asOf, req);
    const thread = [{ at: `${requested} 09:00`, who: PEOPLE.snr, msg: 'Request sent to owner.' }];
    const files = [];
    if (['Submitted', 'Accepted', 'Returned'].includes(status)) { files.push(`${c.id}-${ti ? 'population' : 'procedure'}.${ti ? 'xlsx' : 'pdf'}`); thread.push({ at: `${addDays(requested, 4)} 15:10`, who: c.owner, msg: 'Uploaded.' }); }
    if (status === 'Returned') thread.push({ at: `${addDays(requested, 5)} 10:30`, who: PEOPLE.snr, msg: 'Returned: population has no report parameters, so completeness cannot be confirmed. Please re-run with the parameters visible.' });
    if (status === 'Accepted') thread.push({ at: `${addDays(requested, 6)} 11:00`, who: PEOPLE.snr, msg: 'Accepted.' });
    out.push({ id, audit: a.id, control: c.id, title: t.title, desc: t.desc, owner: c.owner, requested, due: addDays(ORG.asOf, due), status, files, thread, reminders: status === 'Sent' && due < 0 ? 1 : 0 });
  }));
  return out;
}

    ${list.length ? list.map(r => { const st = reqStatus(r), late = reqOverdue(r) ? daysBetween(r.due, today()) : 0; return `<tr class="${st === 'Overdue' ? 'stripe-crit' : ''}"><td class="mono small">${r.id}</td><td><a href="#requests" data-act="openRequest" data-id="${r.id}">${esc(r.title)}</a><div class="tiny faint">${r.control}</div></td><td class="small">${esc(r.owner)}</td><td class="mono small">${r.due}${late ? `<div class="tiny" style="color:var(--crit)">${late}d late${r.reminders ? ` · ${r.reminders} reminder${r.reminders > 1 ? 's' : ''}` : ''}</div>` : ''}</td><td>${reqPill(st)}</td><td class="small">${r.files.length || '<span class="faint">0</span>'}</td><td>${reqActions(r)}</td></tr>`; }).join('') : '<tr><td colspan="7" class="empty">Nothing in this view.</td></tr>'}

function remind(r) { r.reminders = (r.reminders || 0) + 1; r.thread.push({ at: nowStr(), who: ME, msg: `Reminder ${r.reminders}: this request is ${daysBetween(r.due, today())} days past due.` }); }
